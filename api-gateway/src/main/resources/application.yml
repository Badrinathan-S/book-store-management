server:
  port: 8989
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

spring:
  application:
    name: api-gateway

  webflux:
    problemdetails:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allowed-credentials: false

          routes:
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/catalog/**
              filters:
                - RewritePath=/catalog/?(?<segments>.*), /${segments}

            - id: orders-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/orders/**
              filters:
                - RewritePath=/orders/?(?<segments>.*), /${segments}

            # Catalog OpenAPI specification
            - id: catalog-openapi
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/catalog
              filters:
                - SetPath=/v3/api-docs

            # Orders OpenAPI specification
            - id: orders-openapi
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/orders
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    use-root-path: true
